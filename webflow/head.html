@font-face {

@font-face {

/* CSS Document */
@-ms-viewport {
  width: device-width;
  zoom: 1;
}










:root {
	--sansFS: "Montserrat", Helvetica, Verdana, sans-serif;
	--serifFS: "Playfair Display", Georgia, Times, serif;
}

* {
  margin: 0;
  padding: 0;
  border: 0;
  outline: 0;
  font: inherit;
  font-size: 100%;
  vertical-align: baseline;
}

html {
  background: white;
  line-height: 1;
}

body {
  font-size: 20px;
  font-family: 400 var(--sansFS);
  min-width: 320px;
  color: black;
}
body b, body strong {
  font-weight: 600;
}
body i, body em {
  font-style: italic;
}

article, aside, details, figcaption, figure, footer, header, hgroup, main, menu, nav, section, summary {
  display: block;
}

a {
  text-decoration: none;
  border: none;
  outline: none;
  color: inherit;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.455, 0.03, 0.515, 0.955);
}
/* a:hover, a:active, a.select {
  opacity: 0.65;
} */
a img {
  border: none;
}

p {
  font: 400 1em/1.4 var(--sansFS);
	letter-spacing: 0.01em;
  margin-bottom: 20px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
p a {
  color: #9a9490;
}
p.small {
  font-size: 0.8125em;
}

address {
  font: 1em/1.5em var(--serifFS);
  margin-bottom: 20px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
address a {
  color: #9a9490;
}

img {
  display: block;
  width: 100%;
  height: auto;
  transition: all 0.4s cubic-bezier(0.455, 0.03, 0.515, 0.955);
}

h2 {
  font: 400 1.8em/1.2 var(--sansFS);
  margin-bottom: 0.8em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

h3 {
  font: 500 15px/1.47 var(--sansFS);
  margin-bottom: 0;
  letter-spacing: 0.01em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

h4 {
  font: 600 1em/1.2 var(--sansFS);
  text-transform: uppercase;
  margin-bottom: 1em;
  letter-spacing: 1px;
  -webkit-text-size-adjust: none;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

h5 {
  font: 300 15px/1 var(--serifFS);
  text-transform: none;
  margin-bottom: 6px;
  -webkit-text-size-adjust: none;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

h6 {
  font: 12px/1 var(--serifFS);
  -webkit-text-size-adjust: none;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.toGreet {
	font: 300 1.5em/1.13 var(--serifFS);
	margin-bottom: 26px;
	-webkit-font-smoothing: antialiased;
	-moz-osx-font-smoothing: grayscale;
}

sup {
  vertical-align: super;
  font-size: xx-small;
}

sub {
  vertical-align: sub;
  font-size: xx-small;
}

input {
  font: 400 15px/34px var(--sansFS);
  height: 36px;
  margin: 0 auto 10px;
  padding: 0;
  width: 100%;
  box-sizing: border-box;
  background-color: transparent;
  color: black;
  border-bottom: 1px solid #d6d6d6;
  border-radius: 0;
  text-align: center;
}
input[type=checkbox], input[type=radio] {
  display: none;
}
input[type=checkbox]:checked + label, input[type=radio]:checked + label {
  color: white;
  background-color: black;
}

textarea, .autogrowDiv {
  font: 400 15px/34px var(--sansFS);
  margin: 0 auto 10px;
  padding: 0;
  width: 100%;
  box-sizing: border-box;
  background-color: transparent;
  color: black;
  border-bottom: 1px solid #d6d6d6;
  border-radius: 0;
  text-align: center;
  resize: none;
}

.autogrowDiv {
  display: none;
  white-space: pre-wrap;
}

/********* classes *********/
.hide {
  display: none;
}

.error {
  color: #ff0000 !important;
}

.button {
  display: inline-block;
  vertical-align: middle;
  padding: 9px 28px;
  margin: 0 3px 10px;
  font: 600 15px/24px var(--sansFS);
  letter-spacing: 1px;
  text-transform: uppercase;
  text-align: center;
	color: black;
  min-width: 150px;
  //max-width: 300px;
  border: solid 1px black;
	border-radius: 21px;
  background-color: transparent;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  box-sizing: border-box;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.455, 0.03, 0.515, 0.955);
}
.button.fill {
	color: white;
	background-color: black;
}
.button.large {
  min-width: 240px;
}
.button:hover, .button:active {
  background-color: black;
  color: white;
}
.button.fill:hover, .button.fill:active {
	background-color: transparent;
	color: black;
}
.button[disabled], .button.disabled {
  opacity: 0.35;
  pointer-events: none;
}

.line {
  display: inline-block;
  width: 50px;
  border-top: 1px solid #d6d6d6;
  margin-top: 28px;
}

.buttonLink {
  display: inline-block;
  font: 600 0.9em/30px var(--sansFS);
  text-transform: uppercase;
  letter-spacing: 1px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  margin: 0 clamp(10px, 3vw, 40px);
}
.buttonLink span {
	display: inline-block;
	line-height: initial;
}
.buttonLink span:after {
  content: "";
  display: block;
  width: 100%;
  height: 2px;
  background-color: black;
}
.buttonLink.center {
  text-align: center;
}
.buttonLink.center:after {
  margin: 0 auto;
}

.animate {
  transition-property: opacity, transform;
  transition-duration: 1s;
  transition-timing-function: cubic-bezier(0.23, 1, 0.32, 1);
}

.fadeUp {
  transform: translateY(50px);
  opacity: 0;
}

/********* end classes *********/
