<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
// ─────────────────────────────────────────────────────────────────
//  CONFIGURATION — paste your Apps Script Web App URL here after
//  deploying the Google Apps Script (see setup guide below)
// ─────────────────────────────────────────────────────────────────
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyW_tw6VFHiZNEz7iZcm4eTxI3d3mJMGReY7x-bNjx40S1WLgDdgYUe8lrx0vgHTVh0/exec';

// ─────────────────────────────────────────────────────────────────
//  Card / layout sizing
// ─────────────────────────────────────────────────────────────────
var winHeight, winWidth;
var cardPadding = '100vh';

function calculateCardAreaSize() {
  // Use window.innerHeight to match dvh behaviour on iOS Chrome
  // ($(window).height() can differ from actual visible height on mobile)
  winHeight = window.innerHeight;
  cardPadding = (winHeight < 492) ? '492px' : (winHeight >= 492 && winHeight < 900) ? winHeight + 'px' : '900px';
  $('#mainContent').css('padding-top', cardPadding);
  $('#mainContent .cardPreview').css('height', cardPadding);
}

$(window).on('load', function() {
  calculateCardAreaSize();
  setTimeout(function() {
    $('.cardPreview').addClass('active');
    setTimeout(function() {
      $('.cardPreview').addClass('done');
      // Fade in scroll arrow after card animation completes
      $('#scrollArrow').addClass('visible');
    }, 1100);
  }, 100);

  // Initialise guest name from URL or fallback input
  initGuestName();

  // Load existing comments on page load
  loadComments();
});

$(document).ready(function() {

  $(window).resize(function() {
    calculateCardAreaSize();
  });

  $(window).scroll(function(e) {
    var scrolled = $(this).scrollTop();

    // Background texture — slow drift
    $('.backgroundTexture').css('background-position', 'center calc(50% + ' + (scrolled * 0.3) + 'px)');

    // Platter — moves at moderate rate
    var platterY = scrolled * 0.15;
    $('.platterWrap').css('transform', 'translate(-50%, calc(-50% + ' + platterY + 'px))');

    // Shadow — moves faster than platter, creates depth separation
    var shadowY = scrolled * 0.35;
    $('.shadowOverlay').css('transform', 'translateY(' + shadowY + 'px)');

    // Hide arrow once user starts scrolling
    if (scrolled > 40) {
      $('#scrollArrow').removeClass('visible');
    }
  });

  // ── RSVP form: show/hide guest count ──
  $('.rsvpForm .attend').on('change', function() {
    if ($(this).hasClass('no')) {
      $('.rsvpForm .rsvpTotalBox').slideUp(400);
    } else {
      $('.rsvpForm .rsvpTotalBox').slideDown(400);
    }
    $('.rsvpForm .addTotal').slideDown(400);
    $('.rsvpForm .button[type="submit"]').slideDown(400);
  });

  // ── RSVP form: submit to Google Sheets ──
  $('.rsvpForm').submit(function(e) {
    e.preventDefault();
    var $form = $(this);
    var $btn  = $form.find('.button[type="submit"]');

    var attending = $form.find('input[name="rsvp_status"]:checked').val();
    if (!attending) {
      alert('Please select Will Attend or Will Not Attend.');
      return;
    }

    $btn.addClass('disabled').text('Submitting…');

    var payload = {
      type:       'rsvp',
      name:       guestName || 'Guest',
      attending:  attending === '1' ? 'Yes' : 'No',
      total:      $form.find('select[name="rsvp_total"]').val() || '1',
      note:       $form.find('textarea[name="note_to_host"]').val() || '',
      timestamp:  new Date().toISOString()
    };

    // Apps Script requires form-encoded data (not JSON) when called from a browser.
    // We use no-cors mode because Apps Script doesn't return CORS headers on POST.
    // This is fire-and-forget — we optimistically show success immediately.
    fetch(APPS_SCRIPT_URL, {
      method:   'POST',
      mode:     'no-cors',
      headers:  { 'Content-Type': 'application/x-www-form-urlencoded' },
      body:     'data=' + encodeURIComponent(JSON.stringify(payload))
    }).then(function() {
      $btn.removeClass('disabled').addClass('success').text('Thanks for letting us know!');
      $form.find('.formGuts').slideUp(300);
      if (!$form.find('.addCalendarBtn').length) {
        var $calBtn = $('<button type="button" class="button addCalendarBtn">Add to calendar</button>');
        $calBtn.on('click', showCalendarOptions);
        $btn.after($calBtn);
      }
    }).catch(function() {
      $btn.removeClass('disabled').text('Try Again');
      alert('Something went wrong — please try again.');
    });
  });

  // ── Comment form: submit to Google Sheets + display inline ──
  $('.commentForm').submit(function(e) {
    e.preventDefault();
    var $form    = $(this);
    var $btn     = $form.find('.button');
    var $textarea = $form.find('textarea[name="rsvp_comment"]');
    var comment  = $textarea.val().trim();

    if (!comment) {
      alert('Please write a comment before submitting.');
      return;
    }

    $btn.addClass('disabled').text('Submitting…');

    var payload = {
      type:      'comment',
      name:      guestName || 'Guest',
      comment:   comment,
      timestamp: new Date().toISOString()
    };

    fetch(APPS_SCRIPT_URL, {
      method:   'POST',
      mode:     'no-cors',
      headers:  { 'Content-Type': 'application/x-www-form-urlencoded' },
      body:     'data=' + encodeURIComponent(JSON.stringify(payload))
    }).then(function() {
        // Show the comment immediately on the page
        appendComment({ comment: comment, name: guestName, timestamp: payload.timestamp });
        $('.commentsWrapper .comments').slideDown(400);

        $btn.removeClass('disabled').text('Comment Submitted ✓');
        $textarea.val('');

        setTimeout(function() {
          $btn.text('Submit Another');
          $btn.removeClass('disabled');
        }, 3000);
    }).catch(function() {
        $btn.removeClass('disabled').text('Try Again');
        alert('Something went wrong — please try again.');
    });
  });

});

// ─────────────────────────────────────────────────────────────────
//  Helpers: load + render comments from Google Sheets
// ─────────────────────────────────────────────────────────────────
// ─────────────────────────────────────────────────────────────────
//  Read comments directly from Google Sheets published CSV.
//  This is the only browser-reliable method — no CORS, no redirects,
//  no Apps Script sandbox issues.
// ─────────────────────────────────────────────────────────────────
var COMMENTS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-k5rT2i2qzBScnQDDGulf-1xS3PO57YXrDIFdPqO5ArZhoJWmTbprKHJd5LVH4yq9YuTOu1XP5358/pub?gid=147883584&single=true&output=csv';
var GUEST_NUMBERS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-k5rT2i2qzBScnQDDGulf-1xS3PO57YXrDIFdPqO5ArZhoJWmTbprKHJd5LVH4yq9YuTOu1XP5358/pub?gid=161076232&single=true&output=csv';

// ─────────────────────────────────────────────────────────────────
//  Guest name — read from ?name= URL param (set by HubSpot link)
//  Falls back to a visible input field if no param is present.
//
//  HubSpot link format:
//  https://rebecca-and-thomas.webflow.io/?name={{contact.firstname}}
//  Or for full name:
//  https://rebecca-and-thomas.webflow.io/?name={{contact.full_name}}
// ─────────────────────────────────────────────────────────────────
var guestName = '';

function initGuestName() {
  var raw = window.location.search;
  var match = raw.match(/[?&]name=([^]*?)(?:&(?:utm_|gclid|fbclid|ref=)|$)/i);
  if (!match) match = raw.match(/[?&]name=([^]*)/i);

  if (match && match[1]) {
    var decoded = decodeURIComponent(match[1].trim());
    guestName = decoded.replace(/\s+$/, '');
    $('#guestNameDisplay').html(escapeHtml(guestName));
    $('#commentGuestName').val(guestName);
    loadGuestAllowance(guestName);
  } else {
    // No name in URL — show Guest and display soft prompt after short delay
    guestName = 'Guest';
    $('#guestNameDisplay').html('Guest');
    $('#commentGuestName').val('Guest');
    setTimeout(function() { $('#guestPrompt').fadeIn(400); }, 2000);
  }

  // Prompt input — show submit button once user starts typing
  $('#guestPromptInput').on('input', function() {
    var val = $(this).val().trim();
    if (val.length > 0) {
      $('#guestPromptSubmit').fadeIn(200);
    } else {
      $('#guestPromptSubmit').fadeOut(150);
    }
  });

  // Submit: update URL and reload so name persists everywhere
  $('#guestPromptSubmit').on('click', function() {
    var val = $('#guestPromptInput').val().trim();
    if (!val) return;
    var encoded = encodeURIComponent(val);
    var newURL = window.location.pathname + '?name=' + encoded;
    window.location.href = newURL;
  });

  // Also submit on Enter key
  $('#guestPromptInput').on('keydown', function(e) {
    if (e.key === 'Enter') { $('#guestPromptSubmit').trigger('click'); }
  });
}

function escapeHtml(str) {
  return $('<div>').text(str).html();
}


function loadGuestAllowance(name) {
  console.log('[GuestAllowance] Called with name:', name);
  if (!name || name === 'Guest') return;
  console.log('[GuestAllowance] Fetching:', GUEST_NUMBERS_CSV_URL);
  fetch(GUEST_NUMBERS_CSV_URL)
    .then(function(r) { return r.text(); })
    .then(function(csv) {
      var rows = csv.trim().split('\n');
      var allowance = null;
      var nameLower = name.trim().toLowerCase();
      console.log('[GuestAllowance] Looking up:', nameLower, 'rows:', rows.length);
      for (var i = 0; i < rows.length; i++) {
        var cols = rows[i].split(',');
        if (cols.length >= 2) {
          var sheetName = cols[0].replace(/^"+|"+$/g, '').trim().toLowerCase();
          if (sheetName === nameLower) {
            allowance = parseInt(cols[1].replace(/[^0-9]/g, ''), 10);
            console.log('[GuestAllowance] Match! allowance:', allowance);
            break;
          }
        }
      }
      if (allowance && allowance > 0) {
        applyGuestAllowance(allowance);
      } else {
        console.log('[GuestAllowance] No match for:', nameLower);
      }
    })
    .catch(function(err) { console.log('[GuestAllowance] Error:', err); });
}

function applyGuestAllowance(max) {
  var selectEl = document.querySelector('.rsvpTotal');
  if (!selectEl) return;
  selectEl.innerHTML = '';
  for (var i = 1; i <= max; i++) {
    var opt = document.createElement('option');
    opt.value = i;
    opt.text = i;
    if (i === Math.min(max, 2)) opt.selected = true;
    selectEl.appendChild(opt);
  }
  if (max === 1) {
    var box = selectEl.closest('.rsvpTotalBox');
    if (box) box.style.display = 'none';
  }
}

function loadComments() {
  console.log('[Comments] Fetching CSV from Google Sheets...');

  fetch(COMMENTS_CSV_URL)
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(function(csv) {
      console.log('[Comments] CSV received, parsing...');
      var comments = parseCSVComments(csv);
      console.log('[Comments]', comments.length, 'comment(s) found');
      if (comments.length > 0) {
        $('.commentsWrapper .comments .list').empty();
        comments.forEach(function(c) { appendComment(c); });
        $('.commentsWrapper .comments').show();
      }
    })
    .catch(function(err) {
      console.error('[Comments] Failed to load:', err);
    });
}

function parseCSVComments(csv) {
  var lines = csv.trim().split('\n');
  var comments = [];
  for (var i = 1; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    var fields = parseCSVLine(line);
    // Support both old format (Timestamp, Comment) and new (Timestamp, Name, Comment)
    var hasName = fields.length >= 3;
    var commentField = hasName ? fields[2] : fields[1];
    var nameField    = hasName ? fields[1] : '';
    if (commentField && commentField.replace(/^"|"$/g, '')) {
      comments.push({
        timestamp: fields[0].replace(/^"|"$/g, ''),
        name:      nameField.replace(/^"|"$/g, '').replace(/""/g, '"'),
        comment:   commentField.replace(/^"|"$/g, '').replace(/""/g, '"')
      });
    }
  }
  return comments.reverse();
}

function parseCSVLine(line) {
  var fields = [];
  var current = '';
  var inQuotes = false;
  for (var i = 0; i < line.length; i++) {
    var ch = line[i];
    if (ch === '"') {
      if (inQuotes && line[i+1] === '"') { current += '"'; i++; }
      else { inQuotes = !inQuotes; }
    } else if (ch === ',' && !inQuotes) {
      fields.push(current); current = '';
    } else {
      current += ch;
    }
  }
  fields.push(current);
  return fields;
}

function appendComment(c) {
  var date = c.timestamp ? new Date(c.timestamp).toLocaleDateString('en-GB', {
    day: 'numeric', month: 'long', year: 'numeric'
  }) : '';

  var nameStr = (c.name && c.name !== 'Guest') ? $('<div>').text(c.name).html() : '';

  var $card = $('<div>').html(
    (nameStr ? '<p style="font-weight:600; margin-bottom:6px; font-size:0.9em;">' + nameStr + '</p>' : '') +
    '<p>' + $('<div>').text(c.comment).html() + '</p>' +
    (date ? '<p class="small slash" style="color:#9a9490;">' + date + '</p>' : '')
  );

  $('.commentsWrapper .comments .list').append($card);
}

// ── Calendar options ──
function showCalendarOptions() {
  var $btn = $(this);
  if ($btn.next('.calendarOptions').length) {
    $btn.next('.calendarOptions').slideToggle(200);
    return;
  }

  var title = encodeURIComponent('Save The Date | Rebecca & Thomas | 2027');
  var desc  = encodeURIComponent(
    'Please save the date, Saturday, 10th July 2027, to celebrate our wedding.\n\n'
    + 'We cannot wait to gather our favourite people in beautiful Malta to mark the beginning of our next chapter together. '
    + 'A formal invitation with further details will follow.\n\n'
    + 'As this will be a destination celebration, we appreciate that travel arrangements may require time and planning. '
    + 'If you have any questions at all, please feel free to reach out to us.\n\n'
    + 'Kindly note that this will be an adults-only celebration.\n\n'
    + 'Rebecca Bonavia & Thomas Bowers'
  );
  var location = encodeURIComponent('Malta');
  var startDate = '20270710';
  var endDate   = '20270711';

  var googleURL = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + title
    + '&dates=' + startDate + '/' + endDate
    + '&details=' + desc
    + '&location=' + location;

  var outlookDesc = encodeURIComponent(
    'Please save the date, Saturday, 10th July 2027, to celebrate our wedding.\r\n\r\n'
    + 'We cannot wait to gather our favourite people in beautiful Malta to mark the beginning of our next chapter together. '
    + 'A formal invitation with further details will follow.\r\n\r\n'
    + 'As this will be a destination celebration, we appreciate that travel arrangements may require time and planning. '
    + 'If you have any questions at all, please feel free to reach out to us.\r\n\r\n'
    + 'Kindly note that this will be an adults-only celebration.\r\n\r\n'
    + 'Rebecca Bonavia & Thomas Bowers'
  );
  var outlookURL = 'https://outlook.office.com/calendar/action/compose?rru=addevent'
    + '&subject=' + title
    + '&startdt=2027-07-10'
    + '&enddt=2027-07-11'
    + '&body=' + outlookDesc
    + '&location=' + location;

  var yahooURL = 'https://calendar.yahoo.com/?v=60&title=' + title
    + '&st=' + startDate + '&et=' + endDate
    + '&desc=' + desc
    + '&in_loc=' + location;

  var $options = $('<div class="calendarOptions" style="margin-top:8px;display:none;text-align:center;">'
    + '<a class="calOption" href="' + googleURL + '" target="_blank" rel="noopener">Google Calendar</a>'
    + '<a class="calOption" href="' + outlookURL + '" target="_blank" rel="noopener">Outlook</a>'
    + '<a class="calOption" href="' + yahooURL + '" target="_blank" rel="noopener">Yahoo Calendar</a>'
    + '<a class="calOption icsDownload" href="#">Apple / Other (.ics)</a>'
    + '</div>');

  $options.find('.icsDownload').on('click', function(e) {
    e.preventDefault();
    downloadICS();
  });

  $btn.after($options);
  $options.slideDown(200);
}

function downloadICS() {
  var rawDesc = 'Please save the date\\, Saturday\\, 10th July 2027\\, to celebrate our wedding.\\n\\n'
    + 'We cannot wait to gather our favourite people in beautiful Malta to mark the beginning of our next chapter together. '
    + 'A formal invitation with further details will follow.\\n\\n'
    + 'As this will be a destination celebration\\, we appreciate that travel arrangements may require time and planning. '
    + 'If you have any questions at all\\, please feel free to reach out to us.\\n\\n'
    + 'Kindly note that this will be an adults-only celebration.\\n\\n'
    + 'Rebecca Bonavia & Thomas Bowers';
  var stamp = new Date().toISOString().replace(/[-:.]/g,'').slice(0,15) + 'Z';
  var ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Rebecca & Thomas//Save The Date//EN',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    'BEGIN:VEVENT',
    'UID:rebeccaandthomas-savethedate-2027@rebeccaandthomas.net',
    'DTSTAMP:' + stamp,
    'DTSTART;VALUE=DATE:20270710',
    'DTEND;VALUE=DATE:20270711',
    'SUMMARY:Save The Date | Rebecca & Thomas | 2027',
    'DESCRIPTION:' + rawDesc,
    'LOCATION:Malta',
    'STATUS:TENTATIVE',
    'TRANSP:TRANSPARENT',
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');
  // Use data URI for better cross-platform support (iOS Safari, Outlook app)
  var dataURI = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
  var a = document.createElement('a');
  a.href = dataURI;
  a.download = 'SaveTheDate_Rebecca_Thomas_2027.ics';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// ── Wedding countdown ──
function updateCountdown() {
  var el = document.getElementById('weddingCountdown');
  if (!el) return;
  var weddingDate = new Date('2027-07-10T00:00:00');
  var now = new Date();
  var diff = Math.floor((weddingDate - now) / 1000);
  if (diff > 0) el.textContent = diff.toLocaleString();
}
document.addEventListener('DOMContentLoaded', function() {
  updateCountdown();
  setInterval(updateCountdown, 1000);
});

</script>
