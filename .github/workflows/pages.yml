# Publishes to GitHub Pages on every push to main. Only these are uploaded:
#   site/*                    -> /            (main.css, main.js, invite/)
#   preview.html              -> /preview.html
#   assets/chalk/chalk-draw.js, assets/chalk/svg/ -> /illustrations/
# CLAUDE.md, apps-script/, assets/hero/source/ and .claude/ are never served.
# Requires Settings → Pages → Source: "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check JS parses
        run: |
          node --check site/main.js
          node --check site/invite/invite.js
          node --check assets/chalk/chalk-draw.js
      - name: Assemble site
        run: |
          mkdir -p _site/illustrations
          cp -R site/. _site/
          cp preview.html _site/
          cp assets/chalk/chalk-draw.js _site/illustrations/
          cp -R assets/chalk/svg _site/illustrations/svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
